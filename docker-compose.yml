# Dev/API-only stack (postgres + api).
# For full clinic offline (frontend + nginx LAN gateway), use the parent compose:
#   cd .. && docker compose --env-file .env.offline up -d --build
# See ../OFFLINE-SETUP.md

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: phos
      POSTGRES_USER: phos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-phos_dev_password}
    volumes:
      - phos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phos -d phos"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://phos:${POSTGRES_PASSWORD:-phos_dev_password}@postgres:5432/phos?schema=public
    ports: ["4000:4000"]
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/main.js"]
    restart: unless-stopped
volumes:
  phos_postgres_data:
