# Render Blueprint — PHOS API
# Dashboard: New → Blueprint → connect repo containing this file.
# After deploy, set CORS_ORIGINS to your Vercel URL(s), comma-separated.

services:
  - type: web
    name: phos-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:render
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: phos-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 2h
      - key: JWT_REFRESH_TTL_DAYS
        value: "7"
      - key: CORS_ORIGINS
        sync: false
      - key: COOKIE_SECURE
        value: "true"

databases:
  - name: phos-db
    plan: free
    databaseName: phos
    user: phos
